<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>百味菜谱·500道完整版</title>
<style>
:root{--bg:#fff8f0;--pri:#e8743b;--sub:#f4a261;--txt:#3a2e28}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);padding-bottom:72px}
header{position:sticky;top:0;z-index:9;background:var(--pri);color:#fff;padding:14px 16px}
header h1{font-size:18px;display:flex;align-items:center;gap:8px}
.bar{display:flex;gap:8px;margin-top:10px}
.bar input{flex:1;border:none;border-radius:20px;padding:9px 14px;font-size:14px}
.bar button{background:var(--sub);color:#fff;border:none;border-radius:20px;padding:9px 14px;font-size:14px}
.kind{display:flex;gap:8px;margin-top:10px}
.kind button{flex:1;border:none;border-radius:18px;padding:7px;font-size:13px;background:rgba(255,255,255,.25);color:#fff}
.kind button.on{background:#fff;color:var(--pri);font-weight:600}
.alpha{display:flex;flex-wrap:wrap;gap:4px;padding:10px 12px;background:#fff;border-bottom:1px solid #eee}
.alpha span{padding:3px 8px;border-radius:6px;font-size:12px;cursor:pointer;color:#888}
.alpha span.on{background:var(--pri);color:#fff}
.tabs{display:flex;overflow-x:auto;gap:8px;padding:10px 12px;background:#fff;position:sticky;top:132px;z-index:8}
.tabs button{white-space:nowrap;border:1px solid #f0d9c8;background:#fff;color:var(--pri);border-radius:18px;padding:6px 12px;font-size:13px}
.tabs button.on{background:var(--pri);color:#fff}
.count{padding:6px 14px;color:#aaa;font-size:12px}
.list{padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.dish{background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;position:relative}
.dish b{font-size:15px}.dish small{color:#999;display:block;margin-top:4px}
.dish .star{position:absolute;right:10px;top:10px;font-size:16px;color:#ccc}
.dish .star.on{color:#f4b400}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:20}
.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-height:84vh;overflow:auto;border-radius:18px 18px 0 0;padding:22px}
.sheet h2{color:var(--pri);display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet .tag{display:inline-block;background:#fdeee4;color:var(--pri);font-size:12px;padding:2px 10px;border-radius:10px;margin:8px 0}
.sheet h4{margin:14px 0 4px}.sheet li{margin-left:18px;line-height:1.7;font-size:14px}
.sheet .close{color:#aaa;font-size:22px;cursor:pointer}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #eee}
nav button{flex:1;border:none;background:#fff;padding:12px 0;font-size:13px;color:#888}
nav button.on{color:var(--pri);font-weight:600}
</style>
</head>
<body>
<header>
  <h1>🍽️ 百味菜谱 <small style="font-weight:400;font-size:12px">500道·吃/喝分栏·收藏本地存</small></h1>
  <div class="bar">
    <input id="search" placeholder="搜菜名或首字母，如 tcfp / 杨枝甘露">
    <button id="rand">🎲 随机一道</button>
  </div>
  <div class="kind">
    <button class="on" data-kind="eat">🍚 吃的(350)</button>
    <button data-kind="drink">🥤 喝的(150)</button>
  </div>
</header>

<div class="alpha" id="alpha"></div>
<div class="tabs" id="tabs"></div>
<div class="count" id="count">加载中…</div>
<div class="list" id="list"></div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<nav>
  <button class="on" data-nav="all">全部</button>
  <button data-nav="fav">⭐我的收藏</button>
  <button data-nav="rand">🎲随机</button>
</nav>

<script src="data_eat_1.js"></script>
<script src="data_eat_2.js"></script>
<script src="data_eat_3.js"></script>
<script src="data_eat_drink_1.js"></script>
<script src="data_drink_2.js"></script>
<script>
const CATS_EAT=["家常荤菜","素菜时蔬","汤羹炖品","凉菜小食","主食面点","川湘麻辣","粤式风味","地方名菜"];
const CATS_DRINK=["茶饮咖啡","果汁奶昔","甜汤糖水","酒酿特调"];
// 合并所有数据段
const RAW = [].concat(
  typeof s1!=="undefined"?s1:[],
  typeof s2!=="undefined"?s2:[],
  typeof s3!=="undefined"?s3:[],
  typeof s4!=="undefined"?s4:[],
  typeof s5!=="undefined"?s5:[]
);
const DISHES=RAW.map((d,i)=>({id:i,name:d[0],cat:d[1],py:d[2],main:d[3],steps:d[4].split("|"),tip:d[5],kind:d[6]}));
let curKind="eat",curCat="全部",curAlpha="",navMode="all";
let fav=new Set(JSON.parse(localStorage.fav||"[]"));
const $=s=>document.querySelector(s);
const tabs=$("#tabs"),alpha=$("#alpha"),list=$("#list");

function buildTabs(){
  tabs.innerHTML="";
  const cats=curKind==="eat"?CATS_EAT:CATS_DRINK;
  ["全部",...cats].forEach(c=>{
    const b=document.createElement("button");b.textContent=c;if(c===curCat)b.className="on";
    b.onclick=()=>{curCat=c;buildTabs();render();};
    tabs.appendChild(b);
  });
}
"ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(l=>{
  const s=document.createElement("span");s.textContent=l;
  s.onclick=()=>{curAlpha=curAlpha===l?"":l;[...alpha.children].forEach(x=>x.className="");if(curAlpha)s.className="on";render();};
  alpha.appendChild(s);
});
document.querySelectorAll(".kind button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".kind button").forEach(x=>x.className="");b.className="on";
  curKind=b.dataset.kind;curCat="全部";curAlpha="";buildTabs();render();
});
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.className="");b.className="on";
  navMode=b.dataset.nav;render();
});
function kindList(){return DISHES.filter(d=>d.kind===curKind);}
function render(){
  const kw=$("#search").value.trim().toLowerCase();
  let arr=kindList().filter(d=>
    (curCat==="全部"||d.cat===curCat) &&
    (!curAlpha||d.py[0].toUpperCase()===curAlpha) &&
    (!kw||d.name.includes(kw)||d.py.includes(kw))
  );
  if(navMode==="fav")arr=arr.filter(d=>fav.has(d.id));
  if(navMode==="rand"){const k=kindList();if(k.length)open(k[Math.random()*k.length|0].id);return;}
  $("#count").textContent=`共 ${arr.length} 道${navMode==="fav"?"（收藏）":""} · 总库 ${DISHES.length} 道`;
  list.innerHTML=arr.map(d=>`<div class="dish" data-id="${d.id}">
    <span class="star ${fav.has(d.id)?'on':''}" data-star="${d.id}">${fav.has(d.id)?'⭐':'☆'}</span>
    <b>${d.name}</b><small>${d.cat} · ${d.py}</small></div>`).join("")||`<p style="padding:30px;color:#aaa">这里空空如也～</p>`;
  list.querySelectorAll(".dish").forEach(el=>el.onclick=e=>{
    if(e.target.dataset.star!=null){toggleFav(+e.target.dataset.star);return;}
    open(+el.dataset.id);
  });
}
function open(id){
  const d=DISHES.find(x=>x.id===id);
  $("#sheet").innerHTML=`<span class="close" onclick="document.getElementById('modal').classList.remove('show')">✕</span>
   <h2>${d.name}<button style="border:none;background:none;font-size:14px;color:var(--pri)" onclick="toggleFav(${id},this)">${fav.has(id)?'⭐已收藏':'☆收藏'}</button></h2>
   <span class="tag">${d.kind==='eat'?'🍚':'🥤'} ${d.cat} · ${d.py}</span>
   <p>🥗 主料：${d.main}</p>
   <h4>👨‍🍳 步骤</h4><ol>${d.steps.map(s=>`<li>${s}</li>`).join("")}</ol>
   <h4>💡 小贴士</h4><p>${d.tip}</p>`;
  $("#modal").classList.add("show");
}
function toggleFav(id,btn){fav.has(id)?fav.delete(id):fav.add(id);localStorage.fav=JSON.stringify([...fav]);render();if(btn)btn.textContent=fav.has(id)?'⭐已收藏':'☆收藏';}
$("#search").oninput=render;
$("#rand").onclick=()=>{const k=kindList();if(k.length)open(k[Math.random()*k.length|0].id);};

buildTabs();render();
</script>
</body>
</html>
